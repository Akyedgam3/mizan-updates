# ينشر الموقع مع كل دفع على main (كان الموقع ما عم يتحدّث لحالو).
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # إذا مصدر GitHub Pages هو الفرع: منطلب بناء جديد
  branch-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
  # إذا مصدر GitHub Pages هو GitHub Actions: منرفع الموقع مباشرة
  actions-deploy:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
