# ينشر الموقع مع كل دفع على main (كان الموقع ما عم يتحدّث لحالو).
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # بعد كل Release جديد (release.yml بيشغّله) لتتحدّث نسخ /dl
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # مصدر GitHub Pages = GitHub Actions: منرفع الموقع مباشرة
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # نسخة من ملفات آخر Release على الموقع نفسه (waznsy.com/dl/...): بسوريا روابط GitHub Releases بدها VPN
      - name: Copy latest installers to /dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release download --repo "$GITHUB_REPOSITORY" --dir dl --clobber \
            --pattern 'Wazn-Setup.exe' --pattern 'Wazn-Setup-32bit.exe' --pattern 'Wazn.apk' || echo "ما قدرنا نجيب الملفات"
          ls -la dl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
