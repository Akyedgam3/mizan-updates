# ينشر ملفات التنصيب كـ Release. يُدفع الملف على فرع مؤقت "upload/<النسخة>"
# فيه release/Wazn-Setup.exe (ونسخ Mizan/Miyar للروابط القديمة) أو release/Wazn.apk (تطبيق أندرويد) و release/NOTES.md، وبعد النشر بينحذف الفرع
# حتى ما يكبر حجم المستودع.
name: Publish installer

on:
  push:
    branches: ['upload/**']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#upload/}"
          FILES=$(ls release/*.exe release/*.apk 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "ما في ملفات بـ release/"; exit 1; }
          echo "$FILES"
          NOTES="release/NOTES.md"
          [ -f "$NOTES" ] || echo "وزن $VERSION" > "$NOTES"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" $FILES --clobber
          else
            gh release create "v$VERSION" $FILES --title "وزن $VERSION" --notes-file "$NOTES" --target main --latest
          fi
      - name: Remove the upload branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --delete "$GITHUB_REF_NAME" || true
